<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>THOYAJAKSH'S JEE HUB</title>

  <meta
    name="description"
    content="THOYAJAKSH'S JEE HUB — JEE Main, JEE Advanced, BITSAT, Competitive Exams and CBSE Class 11 & 12 preparation."
  >

  <style>

    /* =========================================================
       ROOT / GLOBAL
    ========================================================= */

    :root {
      --bg: #030305;
      --bg2: #07070b;
      --card: #0b0b10;
      --card2: #101017;
      --border: #23232d;

      --text: #f5f7ff;
      --muted: #969aaa;

      --cyan: #22d3ee;
      --blue: #38bdf8;
      --purple: #a855f7;
      --pink: #ec4899;
      --green: #22c55e;
      --orange: #fb923c;
      --yellow: #facc15;

      --glow:
        0 0 25px rgba(34,211,238,.10),
        0 20px 60px rgba(0,0,0,.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(34,211,238,.08),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(168,85,247,.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(236,72,153,.045),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       TOP LIVE UPDATE BAR
    ========================================================= */

    .update-bar {
      height: 38px;
      display: flex;
      align-items: center;

      background:
        linear-gradient(
          90deg,
          #07151a,
          #08080d,
          #100718
        );

      border-bottom: 1px solid rgba(34,211,238,.18);

      overflow: hidden;
      position: relative;
      z-index: 2000;
    }

    .update-label {
      flex-shrink: 0;
      height: 100%;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 0 16px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;

      color: #020204;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--blue)
        );

      box-shadow:
        5px 0 20px rgba(34,211,238,.12);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;

      background: #071014;

      animation: livePulse 1.2s infinite;
    }

    @keyframes livePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .35;
        transform: scale(.65);
      }
    }

    .ticker-window {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker {
      display: inline-flex;
      min-width: max-content;

      animation: tickerMove 28s linear infinite;
    }

    .ticker:hover {
      animation-play-state: paused;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 0 35px;

      color: #cfd3df;
      font-size: 12px;
    }

    .ticker-item strong {
      color: var(--cyan);
    }

    .ticker-separator {
      color: #424452;
    }

    @keyframes tickerMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      backdrop-filter: blur(20px);

      background:
        rgba(3,3,5,.84);

      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1280px;
      margin: auto;

      padding: 13px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      cursor: pointer;
      min-width: 0;
    }

    .brand-logo {
      width: 49px;
      height: 49px;

      object-fit: contain;

      border-radius: 13px;

      background: #08080b;

      border: 1px solid #2a2a34;

      box-shadow:
        0 0 25px rgba(34,211,238,.07);
    }

    .brand-info {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      line-height: 1.1;

      font-weight: 900;
      letter-spacing: .7px;

      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;

      color: var(--cyan);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .7px;

      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-links button {
      border: 1px solid transparent;

      background: transparent;

      color: var(--muted);

      padding: 9px 12px;

      border-radius: 9px;

      font-size: 13px;

      transition: .2s;
    }

    .nav-links button:hover {
      color: white;

      background: #101016;

      border-color: var(--border);
    }

    .menu-btn {
      display: none;

      border: 1px solid var(--border);

      background: #101016;

      color: white;

      padding: 9px 12px;

      border-radius: 9px;
    }

    /* =========================================================
       MAIN
    ========================================================= */

    main {
      max-width: 1280px;

      margin: auto;

      padding:
        25px 20px 70px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      min-height: 470px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 70px 20px;

      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(34,211,238,.09),
          transparent 68%
        );

      pointer-events: none;
    }

    .hero-grid {
      position: absolute;
      inset: 0;

      opacity: .12;

      background-image:
        linear-gradient(
          rgba(255,255,255,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.035) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;

      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border-radius: 999px;

      color: var(--cyan);

      background: rgba(34,211,238,.045);

      border: 1px solid rgba(34,211,238,.22);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1.2px;

      margin-bottom: 22px;
    }

    .hero h1 {
      font-size:
        clamp(40px, 7vw, 82px);

      line-height: .92;

      letter-spacing: -4px;

      font-weight: 950;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--blue),
          var(--purple),
          var(--pink)
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero h2 {
      margin-top: 14px;

      font-size:
        clamp(20px, 3vw, 31px);

      letter-spacing: 4px;

      color: white;
    }

    .hero-description {
      max-width: 760px;

      margin: 20px auto 0;

      color: var(--muted);

      line-height: 1.75;

      font-size: 14px;
    }

    .exam-pills {
      margin-top: 20px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 7px;
    }

    .exam-pill {
      padding: 6px 10px;

      border: 1px solid var(--border);

      border-radius: 999px;

      background: rgba(255,255,255,.025);

      color: #c9ccd7;

      font-size: 10px;
    }

    .search-box {
      width: min(720px, 100%);

      margin-top: 28px;

      position: relative;
    }

    .search-box input {
      width: 100%;

      padding:
        17px 55px 17px 19px;

      border-radius: 15px;

      border: 1px solid #292933;

      outline: none;

      background: rgba(9,9,13,.9);

      color: white;

      box-shadow: var(--glow);

      transition: .2s;
    }

    .search-box input::placeholder {
      color: #626675;
    }

    .search-box input:focus {
      border-color: var(--cyan);

      box-shadow:
        0 0 0 3px rgba(34,211,238,.07),
        var(--glow);
    }

    .search-icon {
      position: absolute;

      right: 19px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--cyan);

      font-size: 20px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 13px;

      margin-bottom: 50px;
    }

    .stat {
      padding: 21px;

      text-align: center;

      border-radius: 16px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          #0e0e13,
          #08080b
        );
    }

    .stat strong {
      display: block;

      font-size: 27px;

      color: var(--cyan);

      margin-bottom: 5px;
    }

    .stat span {
      color: var(--muted);

      font-size: 11px;
    }

    /* =========================================================
       SECTION
    ========================================================= */

    .section {
      margin-top: 45px;
    }

    .section-title {
      display: flex;

      align-items: end;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 19px;
    }

    .section-title h2 {
      font-size: 25px;
    }

    .section-title p {
      color: var(--muted);

      font-size: 12px;

      margin-top: 5px;
    }

    .back-btn {
      border: 1px solid var(--border);

      background: #101016;

      color: white;

      padding: 9px 13px;

      border-radius: 9px;

      transition: .2s;
    }

    .back-btn:hover {
      border-color: var(--cyan);

      color: var(--cyan);
    }

    /* =========================================================
       CARDS
    ========================================================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }

    .grid-4 {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;
    }

    .card {
      position: relative;

      overflow: hidden;

      padding: 22px;

      border-radius: 18px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--card);

      box-shadow:
        0 10px 35px rgba(0,0,0,.16);

      transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      right: -70px;
      top: -70px;

      border-radius: 50%;

      background:
        var(--accent, var(--cyan));

      opacity: .06;
    }

    .card:hover {
      transform: translateY(-5px);

      border-color: #3c3d49;

      box-shadow: var(--glow);
    }

    .card-icon {
      width: 49px;
      height: 49px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: #15151c;

      border: 1px solid var(--border);

      font-size: 22px;

      margin-bottom: 15px;
    }

    .card h3 {
      font-size: 18px;

      margin-bottom: 7px;
    }

    .card p {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .card-btn {
      width: 100%;

      margin-top: 17px;

      padding: 11px;

      border-radius: 10px;

      border: 1px solid var(--border);

      background: #111117;

      color: white;

      transition: .2s;
    }

    .card-btn:hover {
      color: var(--cyan);

      border-color: var(--cyan);

      background: rgba(34,211,238,.035);
    }

    /* =========================================================
       SUBJECT COLORS
    ========================================================= */

    .physics {
      --accent: var(--blue);
    }

    .chemistry {
      --accent: var(--green);
    }

    .maths {
      --accent: var(--purple);
    }

    /* =========================================================
       CHAPTERS
    ========================================================= */

    .chapter-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .chapter {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 14px;

      border-radius: 13px;

      background: #0b0b10;

      border: 1px solid var(--border);

      transition: .2s;
    }

    .chapter:hover {
      transform: translateX(3px);

      border-color: #41424e;
    }

    .chapter-left {
      display: flex;

      align-items: center;

      gap: 11px;

      min-width: 0;
    }

    .chapter-number {
      flex-shrink: 0;

      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border-radius: 8px;

      background: #15151b;

      color: var(--cyan);

      font-size: 11px;

      font-weight: 800;
    }

    .chapter-name {
      font-size: 13px;

      color: #e4e6ed;
    }

    /* =========================================================
       RESOURCE CARDS
    ========================================================= */

    .resource-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .resource-card {
      padding: 19px;

      border-radius: 15px;

      border: 1px solid var(--border);

      background: #0b0b10;
    }

    .resource-type {
      display: inline-block;

      color: var(--cyan);

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1.3px;

      text-transform: uppercase;

      margin-bottom: 9px;
    }

    .resource-card h3 {
      font-size: 16px;

      margin-bottom: 7px;
    }

    .resource-card p {
      color: var(--muted);

      font-size: 12px;

      line-height: 1.55;
    }

    .resource-card button {
      width: 100%;

      margin-top: 14px;

      padding: 10px;

      border-radius: 9px;

      background: #131319;

      color: white;

      border: 1px solid var(--border);

      transition: .2s;
    }

    .resource-card button:hover {
      color: var(--cyan);

      border-color: var(--cyan);
    }

    /* =========================================================
       PANELS
    ========================================================= */

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .empty {
      padding: 40px;

      text-align: center;

      color: var(--muted);

      border: 1px dashed var(--border);

      border-radius: 15px;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      margin-top: 70px;

      padding: 32px 20px;

      text-align: center;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 12px;
    }

    footer strong {
      color: white;
    }

    .made-by {
      margin-top: 8px;

      color: var(--cyan);

      font-weight: 600;
    }

    .footer-small {
      margin-top: 8px;

      color: #5f6270;

      font-size: 10px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 950px) {

      .grid-4 {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .resource-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 720px) {

      .update-bar {
        height: 34px;
      }

      .update-label {
        padding: 0 11px;

        font-size: 9px;
      }

      .ticker-item {
        padding: 0 22px;

        font-size: 10px;
      }

      .nav {
        padding: 11px 14px;
      }

      .brand-title {
        font-size: 14px;
      }

      .brand-subtitle {
        font-size: 7px;

        letter-spacing: .35px;
      }

      .brand-logo {
        width: 43px;
        height: 43px;
      }

      .nav-links {
        display: none;

        position: absolute;

        top: 70px;

        left: 12px;
        right: 12px;

        padding: 10px;

        flex-direction: column;

        align-items: stretch;

        border-radius: 14px;

        border: 1px solid var(--border);

        background: #09090d;

        box-shadow: var(--glow);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links button {
        text-align: left;
      }

      .menu-btn {
        display: block;
      }

      .hero {
        min-height: 430px;

        padding:
          50px 10px;
      }

      .hero h1 {
        letter-spacing: -2.5px;
      }

      .grid,
      .grid-4,
      .resource-grid,
      .chapter-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        align-items: flex-start;

        flex-direction: column;
      }

      main {
        padding-left: 13px;
        padding-right: 13px;
      }

    }

    @media (max-width: 420px) {

      .brand-subtitle {
        max-width: 185px;

        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 15px 8px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================================
       LIVE UPDATE TICKER
  ========================================================= -->

  <div class="update-bar">

    <div class="update-label">
      <span class="live-dot"></span>
      NEW UPDATES
    </div>

    <div class="ticker-window">

      <div class="ticker" id="ticker">

        <!-- JavaScript automatically fills this -->

      </div>

    </div>

  </div>


  <!-- =========================================================
       HEADER
  ========================================================= -->

  <header>

    <div class="nav">

      <div
        class="brand"
        onclick="goHome()"
      >

        <img
          src="logo.png"
          alt="THOYAJAKSH'S JEE HUB Logo"
          class="brand-logo"
        >

        <div class="brand-info">

          <div class="brand-title">
            THOYAJAKSH'S JEE HUB
          </div>

          <div class="brand-subtitle">
            JEE Main • JEE Advanced • BITSAT • Competitive Exams • CBSE 11 & 12
          </div>

        </div>

      </div>


      <nav
        class="nav-links"
        id="navLinks"
      >

        <button onclick="goHome()">
          Ho
